<!doctype html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HYPER HALL</title>
        <link rel="stylesheet" href="css/index.css" />
    </head>
    <body>
        <h1>HYPER HALL</h1>

        <!-- login -->
        
        <section id="login">
            
                <div class="CLR">
                    <h2>Login</h2>

                    <div class="nomeLogin"> <!-- nomeLogin -->
                        <label for="nomeUsu">Nome:</label>
                        <input type="text" id="nomeUsu" name="nomeUsu" required/>
                    </div>

                    <div class="senhaLogin"> <!-- senhaLogin -->
                        <label for="senhaUsu">Senha:</label>
                        <input type="password" id="senhaUsu" name="senhaUsu"/>
                    </div>

                    <div class="botaoLogin">
                        <button type="submit" onclick="logar()">Logar</button>
                    </div>

                    <div>
                        <p>Não tem uma conta? <a href="#" onclick="mostrarTela('registro')">Registrar</a></p>
                    </div>
                </div>

        </section>
        
        
        <!-- registro -->

        <section id="registro" class="hidden">
            
                <div class="CLR">

                    <h2>Registro</h2>

                    <div class="nomeLogin"> <!-- nome -->
                        <label for="REnomeUsu">Nome:</label>
                        <input type="text" id="REnomeUsu" name="REnomeUsu"/>
                    </div>

                    <div class="senhaLogin"> <!-- senha -->
                        <label for="REsenhaUsu">Senha:</label>
                        <input type="password" id="REsenhaUsu" name="REsenhaUsu"/>
                    </div>

                    <div class="Email"> <!-- Email -->
                        <label for="REemailUsu">Email:</label>
                        <input type="email" id="REemailUsu" name="REemailUsu"/>
                    </div>

                    <div class="botaoRegistro">
                        <button type="submit" onclick="registrar()">Registrar</button>
                    </div>

                    <div>
                        <p>Já tem uma conta? <a href="#" onclick="mostrarTela('login')">Login</a></p>
                    </div>
                </div>
            
        </section>

        <!-- Corpo pos login -->
        
        <section id="corpo" class="hidden">

            <div id="corpoJogos" style="display: flex;">

            <h2>JOGOS</h2> <!-- jogos -->

            <div class="cama" >
                <div class="card">
                   <a href="https://play.google.com/store/apps/details?id=com.monkeyibrow.worldsoccerchamps&hl=pt_BR" target="_blank" rel="noopener noreferrer">
                       <img src="img/jogos/wsc.jpg" alt="WSC" />
                        <p>Soccer Champs</p>
                    </a>
                </div>
                <div class="card">
                    <a href="#" target="_blank" rel="noopener noreferrer">
                        <img src="img/jogos/fl.jpg" alt="FL" />
                        <p>Football League</p>
                    </a>
                </div>
                <div class="card">
                    <a href="#" target="_blank" rel="noopener noreferrer">
                        <img src="img/jogos/dls.png" alt="DLS" />
                        <p>DLS</p>
                    </a>
                </div>

                <div class="card">
                    <a href="https://eaglercraft.com" target="_blank" rel="noopener noreferrer">
                        <img src="img/jogos/mine.webp" alt="Minecraft" />
                        <p>Minecraft</p>
                    </a>
                </div>

                <div class="card">
                    <a href="https://www.roblox.com/pt" target="_blank" rel="noopener noreferrer">
                        <img src="img/jogos/roblox.webp" alt="Roblox" />
                        <p>Roblox</p>
                    </a>
                </div>
            </div>

        </div>

        
        
        <div id="corpoApps" style="display: none;"> <!-- apps -->
            
                <h2>APPS</h2>
    
                <div class="cama">
    
                    <div class="card">
                        <a href="https://open.spotify.com/intl-pt" target="_blank" rel="noopener noreferrer">
                            <img src="img/apps/spotify.png" alt="Spotify" />
                            <p>Spotify</p>
                        </a>
                        
                    </div>
                    <div class="card">
                        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
                            <img src="img/apps/instagram.png" alt="Instagram" />
                            <p>Instagram</p>
                        </a>
                    </div>
                    <div class="card">
                        <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer">
                            <img src="img/apps/twitter.png" alt="Twitter" />
                            <p>Twitter</p>
                        </a>
                    </div>

                    <div class="card">
                        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
                            <img src="img/apps/Youtube_logo.png" alt="Youtube" />
                            <p>Youtube</p>
                        </a>
                    </div>
    
                </div>
                
            </div>
            
            
            <div id="setas"> <!-- setas -->
                <button id="setaEsquerda" onclick="moverEsquerda()"><img src="img/setas/seEsq.png" alt="Seta Esquerda" /></button>
                <button id="setaDireita" onclick="moverDireita()"><img src="img/setas/seDir.png" alt="Seta Direita" /></button>
            </div>

            <div class="retornarLogin"> <!-- retornarLogin -->
                <button  onclick="mostrarTela('login')">Retornar ao Login</button>
            </div>
            
        </section>
        
        
        <!-- <button onclick="mostrar()">Mostrar</button> -->
        
        <div id="pe">
            <footer>
                <p>Copyright © 2026 Ysmart2303. Todos os direitos reservados.</p>
            </footer>
        </div>
            
            
        <script src="js/index.js"></script>
    </body>
</html>
